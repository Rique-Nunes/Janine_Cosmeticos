services:
  janine-db:
    image: mariadb:10.11
    container_name: janine-db
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=janine_root_secret
      - MARIADB_DATABASE=janine_comercios
      - MARIADB_USER=janine_user
      - MARIADB_PASSWORD=janine_pass_123
    volumes:
      - janine_db_data:/var/lib/mysql
      - ./database/janine_comercios.sql:/docker-entrypoint-initdb.d/init.sql:ro

  janine-cosmeticos:
    build:
      context: .
      dockerfile: Dockerfile
    image: janine-cosmeticos:latest
    container_name: janine-cosmeticos
    restart: always
    depends_on:
      - janine-db
    ports:
      - "8080:80"
    environment:
      - DB_HOST=janine-db
      - DB_USER=janine_user
      - DB_PASSWORD=janine_pass_123
      - DB_NAME=janine_comercios
      - DB_PORT=3306

volumes:
  janine_db_data:
